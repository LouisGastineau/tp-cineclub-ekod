<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription — MovieBase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">MovieBase</div>
    <ul class="navbar-links">
        <li><a th:href="@{/}">Accueil</a></li>
        <li><a th:href="@{/movies}">Films</a></li>
        <li><a th:href="@{/directors}">Directeurs</a></li>
    </ul>
</nav>

<section class="hero">
    <div class="auth-card">
        <h2>Inscription</h2>

        <p class="auth-error" th:if="${error}" th:text="${error}"></p>

        <form method="post" th:action="@{/register}">
            <div class="form-group">
                <label>Prénom</label>
                <input type="text" name="firstName" placeholder="Jean" required />
            </div>
            <div class="form-group">
                <label>Nom</label>
                <input type="text" name="lastName" placeholder="Dupont" required />
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="ton@email.com" required />
            </div>
            <div class="form-group">
                <label>Mot de passe <span class="hint">(8 caractères min)</span></label>
                <input type="password" name="password" placeholder="••••••••" required />
            </div>
            <button type="submit" class="btn btn-primary btn-full">Créer mon compte</button>
        </form>

        <p class="auth-footer">Déjà un compte ? <a th:href="@{/login}">Se connecter</a></p>
    </div>
</section>

</body>
</html>
