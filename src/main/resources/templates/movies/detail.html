<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.title} + ' — MovieBase'">Film — MovieBase</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar">
    <div class="navbar-logo">MovieBase</div>
    <ul class="navbar-links">
        <li><a th:href="@{/}">Accueil</a></li>
        <li><a th:href="@{/movies}">Films</a></li>
        <li><a th:href="@{/directors}">Directeurs</a></li>
    </ul>
    <ul class="navbar-links">
        <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Connexion</a></li>
        <li sec:authorize="isAnonymous()"><a class="btn btn-primary" th:href="@{/register}">S'inscrire</a></li>
        <li sec:authorize="isAuthenticated()"><a th:href="@{/logout}">Déconnexion</a></li>
    </ul>
</nav>

<div class="page-content">
    <a class="back-link" th:href="@{/movies}">← Retour aux films</a>

    <div class="detail-card">
        <div class="detail-header">
            <span class="movie-card-genre" th:text="${movie.genre}">Genre</span>
            <h1 class="detail-title" th:text="${movie.title}">Titre</h1>
            <div class="detail-meta">
                <span th:text="${movie.releaseYear}">2024</span>
                <span class="dot">·</span>
                <span th:text="${movie.durationMinutes} + ' min'">120 min</span>
                <span class="dot">·</span>
                <span th:text="${movie.director.firstName} + ' ' + ${movie.director.lastName}">Réalisateur</span>
            </div>
        </div>

        <p class="detail-synopsis" th:text="${movie.synopsis}">Synopsis...</p>

        <div class="detail-director">
            <div class="director-avatar" th:text="${#strings.substring(movie.director.firstName,0,1)} + ${#strings.substring(movie.director.lastName,0,1)}">AB</div>
            <div>
                <div class="director-name" th:text="${movie.director.firstName} + ' ' + ${movie.director.lastName}">Nom</div>
                <div class="director-info" th:text="${movie.director.nationality}">Nationalité</div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
